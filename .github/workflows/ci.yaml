name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🎨 Format
        run: bun run format

      - name: 🔍 Lint
        run: bun run lint

      - name: 🧪 Typecheck
        run: bun run typecheck

      - name: 🏗️ Build
        run: bun run build
